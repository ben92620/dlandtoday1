<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:title" content="@dlandtoday — Links">
<meta property="og:description" content="Disneyland tips, trip planning & park updates. Find dlandtoday on YouTube, Instagram, and TikTok.">

<meta property="og:type" content="website">
<style>
  :root {
    --ink: #1b1440;
    --ink-soft: rgba(27, 20, 64, 0.7);
    --gold: #f6c453;
    --gold-deep: #e0a92e;
    --card-bg: rgba(255, 255, 255, 0.94);
    --focus-ring: rgba(246, 196, 83, 0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: 'Segoe UI', Avenir, 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.18) 0, rgba(255,255,255,0) 40%),
      radial-gradient(circle at 80% 85%, rgba(255,255,255,0.12) 0, rgba(255,255,255,0) 45%),
      linear-gradient(160deg, #2a1e63 0%, #4a2f8f 45%, #7c4fbf 75%, #a86fd6 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    color: var(--ink);
    position: relative;
    overflow-x: hidden;
  }

  /* soft sparkle dots */
  .sparkle {
    position: fixed;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
    filter: blur(0.3px);
    pointer-events: none;
  }

  .page {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 1;
  }

  .badge {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff7e0 0%, var(--gold) 55%, var(--gold-deep) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25), inset 0 0 0 4px rgba(255,255,255,0.35);
    margin-bottom: 18px;
  }

  h1 {
    font-size: 26px;
    margin: 0 0 4px;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
    letter-spacing: 0.5px;
    text-align: center;
  }

  .tagline {
    color: rgba(255,255,255,0.9);
    font-size: 14.5px;
    margin: 0 0 28px;
    text-align: center;
    max-width: 320px;
    line-height: 1.5;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 15px 18px;
    background: var(--card-bg);
    border-radius: 16px;
    text-decoration: none;
    color: var(--ink);
    font-weight: 600;
    font-size: 16px;
    box-shadow: 0 6px 18px rgba(20, 10, 50, 0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    border: 1px solid rgba(255,255,255,0.5);
  }

  .link-card:hover,
  .link-card:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(20, 10, 50, 0.28);
    background: #ffffff;
  }

  .link-card:focus-visible {
    outline: 3px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .link-card:active { transform: translateY(0); }

  .icon {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg { width: 22px; height: 22px; }

  .icon.youtube { background: #FF0000; }
  .icon.instagram { background: linear-gradient(135deg, #F58529 0%, #DD2A7B 45%, #8134AF 75%, #515BD4 100%); }
  .icon.tiktok { background: #010101; }

  .label-group { display: flex; flex-direction: column; gap: 1px; }
  .platform-name { font-size: 15.5px; }
  .handle { font-size: 12.5px; font-weight: 400; color: var(--ink-soft); }

  .arrow {
    margin-left: auto;
    color: var(--ink-soft);
    font-size: 18px;
  }

  footer {
    margin-top: 30px;
    color: rgba(255,255,255,0.75);
    font-size: 12.5px;
    text-align: center;
  }

  @media (prefers-color-scheme: dark) {
    .link-card { background: rgba(255,255,255,0.96); }
  }

  /* --- shooting star + sparkle effects --- */
  .sparkle-field {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .twinkle-dot {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    opacity: 0;
    box-shadow: 0 0 6px 1px rgba(255,255,255,0.8);
    animation-name: twinkle;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1); }
  }

  .shooting-star {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 12px 4px rgba(255,255,255,0.9), 0 0 26px 9px rgba(246,196,83,0.6);
    pointer-events: none;
    z-index: 50;
  }

  .shooting-star::after {
    content: '';
    position: absolute;
    top: 50%;
    right: 100%;
    width: 90px;
    height: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.85) 100%);
    transform: translateY(-50%);
  }

  .spark-particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 45;
  }

  @keyframes explode-particle {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
  }
</style>
</head>
<body>

  <div class="page">
    <div class="badge" aria-hidden="true">🏰</div>
    <h1>@Dlandtoday</h1>
    <p class="tagline">Videos you can explore. YouTube has 360 views! Find us everywhere below 👇</p>

    <nav class="links" aria-label="Social links">
      <a class="link-card" href="https://youtube.com/@dlandtoday" target="_blank" rel="noopener">
        <span class="icon youtube" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="white"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>
        </span>
        <span class="label-group">

      <a class="link-card" href="https://instagram.com/dlandtoday" target="_blank" rel="noopener">
        <span class="icon instagram" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="white"><path d="M12 2.2c3.2 0 3.6 0 4.8.07 1.2.06 2 .24 2.7.52.75.29 1.35.68 1.96 1.29.6.6 1 1.2 1.29 1.96.28.7.46 1.5.52 2.7.06 1.2.07 1.6.07 4.8s0 3.6-.07 4.8c-.06 1.2-.24 2-.52 2.7a5.4 5.4 0 0 1-1.29 1.96 5.4 5.4 0 0 1-1.96 1.29c-.7.28-1.5.46-2.7.52-1.2.06-1.6.07-4.8.07s-3.6 0-4.8-.07c-1.2-.06-2-.24-2.7-.52a5.4 5.4 0 0 1-1.96-1.29 5.4 5.4 0 0 1-1.29-1.96c-.28-.7-.46-1.5-.52-2.7C2.2 15.6 2.2 15.2 2.2 12s0-3.6.07-4.8c.06-1.2.24-2 .52-2.7.29-.75.68-1.35 1.29-1.96A5.4 5.4 0 0 1 6.04 2.7c.7-.28 1.5-.46 2.7-.52C9.94 2.2 10.4 2.2 12 2.2Zm0 1.8c-3.14 0-3.5 0-4.74.07-1 .05-1.55.21-1.9.35-.48.19-.82.41-1.18.77-.36.36-.58.7-.77 1.18-.14.36-.3.9-.35 1.9C3 9.5 3 9.86 3 13c0 3.14 0 3.5.07 4.74.05 1 .21 1.55.35 1.9.19.48.41.82.77 1.18.36.36.7.58 1.18.77.36.14.9.3 1.9.35 1.24.06 1.6.07 4.74.07s3.5 0 4.74-.07c1-.05 1.55-.21 1.9-.35.48-.19.82-.41 1.18-.77.36-.36.58-.7.77-1.18.14-.36.3-.9.35-1.9.06-1.24.07-1.6.07-4.74s0-3.5-.07-4.74c-.05-1-.21-1.55-.35-1.9a3.6 3.6 0 0 0-.77-1.18 3.6 3.6 0 0 0-1.18-.77c-.36-.14-.9-.3-1.9-.35C15.5 4 15.14 4 12 4Zm0 3.4a4.6 4.6 0 1 1 0 9.2 4.6 4.6 0 0 1 0-9.2Zm0 1.8a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6Zm4.8-2a1.08 1.08 0 1 1 0 2.16 1.08 1.08 0 0 1 0-2.16Z"/></svg>
        </span>
        <span class="label-group">
          <span class="platform-name">Instagram</span>
          <span class="handle">@dlandtoday</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link-card" href="https://tiktok.com/@dlandtoday" target="_blank" rel="noopener">
        <span class="icon tiktok" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="white"><path d="M16.6 2h-3.3v13.7c0 1.6-1.3 3-3 3s-3-1.4-3-3 1.3-3 3-3c.3 0 .6 0 .9.1V9.4c-.3 0-.6-.1-.9-.1-3.4 0-6.2 2.8-6.2 6.2S6.9 21.7 10.3 21.7s6.2-2.8 6.2-6.2V8.9c1.2.9 2.7 1.4 4.3 1.4V7c-2.3 0-4.2-1.9-4.2-4.2V2Z"/></svg>
        </span>
        <span class="label-group">
          <span class="platform-name">TikTok</span>

    </nav>

    <footer>© 2026 dlandtoday · Not affiliated with The Walt Disney Company</footer>
  </div>

<script>
(function () {
  var badge = document.querySelector('.badge');

  var sparkleField = document.createElement('div');
  sparkleField.className = 'sparkle-field';
  sparkleField.setAttribute('aria-hidden', 'true');
  document.body.appendChild(sparkleField);

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function addAmbientTwinkles(count) {
    for (var i = 0; i < count; i++) {
      var dot = document.createElement('span');
      dot.className = 'twinkle-dot';
      var size = rand(2, 4);
      dot.style.width = size + 'px';
      dot.style.height = size + 'px';
      dot.style.left = rand(0, 100) + 'vw';
      dot.style.top = rand(0, 100) + 'vh';
      dot.style.animationDuration = rand(1.8, 4) + 's';
      dot.style.animationDelay = rand(0, 4) + 's';
      sparkleField.appendChild(dot);
    }
  }

  function explode(x, y) {
    var count = 18;
    for (var i = 0; i < count; i++) {
      var p = document.createElement('span');
      p.className = 'spark-particle';
      var size = rand(3, 7);
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      var color = Math.random() > 0.5 ? '#f6c453' : '#ffffff';
      p.style.background = color;
      p.style.boxShadow = '0 0 8px 2px ' + color;
      var angle = rand(0, Math.PI * 2);
      var dist = rand(40, 120);
      p.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
      p.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
      p.style.animation = 'explode-particle ' + rand(0.6, 1.2) + 's ease-out forwards';
      document.body.appendChild(p);
      p.addEventListener('animationend', function () { this.remove(); });
    }
  }

  function launchShootingStar() {
    if (!badge || typeof badge.animate !== 'function') { addAmbientTwinkles(35); return; }

    var rect = badge.getBoundingClientRect();
    var endX = rect.left + rect.width / 2;
    var endY = rect.top + rect.height / 2;
    var startX = -60;
    var startY = -60;

    var star = document.createElement('div');
    star.className = 'shooting-star';
    var angle = Math.atan2(endY - startY, endX - startX) * 180 / Math.PI;
    star.style.transform = 'rotate(' + angle + 'deg)';
    document.body.appendChild(star);

    var anim = star.animate([
      { left: startX + 'px', top: startY + 'px', opacity: 0 },
      { opacity: 1, offset: 0.08 },
      { left: (endX - 3) + 'px', top: (endY - 3) + 'px', opacity: 1 }
    ], { duration: 1375, easing: 'cubic-bezier(.3,.6,.4,1)', fill: 'forwards' });

    anim.onfinish = function () {
      star.remove();
      explode(endX, endY);
      addAmbientTwinkles(38);
    };
  }

  window.addEventListener('load', function () {
    setTimeout(launchShootingStar, 400);
  });
})();
</script>
</body>
</html>
